[project]
name = "nyan-pack"
version = "0.2.0"
description = "Plugin-driven BLE backpack display with MPRIS, calibration, and a user service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bleak>=2.1.1",
    "pillow>=12.1.1",
]

[project.scripts]
nyan = "nyan_pack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nyan_pack"]
